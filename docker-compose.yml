services:
  db:
    image: postgis/postgis:16-3.4
    container_name: crimelens_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crimelens}
      POSTGRES_USER: ${POSTGRES_USER:-crimelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crimelens}
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crimelens -d crimelens']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: crimelens_app
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-crimelens}:${POSTGRES_PASSWORD:-crimelens}@db:5432/${POSTGRES_DB:-crimelens}
      SESSION_SECRET: ${SESSION_SECRET:-crimelens-dev-secret-change-in-production-32chars}
      PORT: ${PORT:-3000}
      MAIL_MODE: ${MAIL_MODE:-console}
      GMAIL_FROM: ${GMAIL_FROM:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: package.json

volumes:
  pg_data:
